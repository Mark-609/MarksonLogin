<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register</title>
  <link rel="icon" href="https://i.postimg.cc/yY90T1RX/Markson-New-Favicon.png" type="image/png">
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body {
      margin: 0;
      background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      position: relative;
    }
    .container {
      background: #1e2a38;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 400px;
      text-align: center;
      z-index: 1;
    }
    input, button {
      width: 100%;
      padding: 0.75rem;
      margin: 0.5rem 0;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
    }
    input {
      background: #2f3e4d;
      color: #fff;
    }
    button {
      background: #00bcd4;
      color: #fff;
      cursor: pointer;
    }
    button:hover {
      background: #0097a7;
    }
    .toggle {
      margin-top: 1rem;
      font-size: 0.9rem;
    }
    .toggle a {
      color: #90caf9;
      text-decoration: none;
    }
    #message {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #ffccbc;
    }
    .logo {
      position: absolute;
      bottom: 20px;
      text-align: center;
      width: 100%;
    }
    .logo img {
      width: 200px;
      height: auto;
      opacity: 0.95;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Register</h2>
    <form id="register-form">
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Register</button>
    </form>
    <div class="toggle">
      <a href="index.html">Already have an account? Login</a>
    </div>
    <div id="message"></div>
  </div>

  <div class="logo">
    <img src="https://i.postimg.cc/s25PDVjd/Markson-New.png" alt="Markson Logo" />
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script>
    const client = window.supabase.createClient(
      'https://ddxscnalvhuresqpdows.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRkeHNjbmFsdmh1cmVzcXBkb3dzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA1MzY5MjksImV4cCI6MjA3NjExMjkyOX0.1ixT38jQN36PV2-R68DmBAx8fRZzeY9Nw5kzsc3fZzY'
    );

    const form = document.getElementById('register-form');
    const message = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const { error } = await client.auth.signUp({ email, password });

      if (error) {
        message.textContent = 'Registration failed: ' + error.message;
      } else {
        message.textContent = 'Logged in successfully!';
        setTimeout(() => window.location.href = 'CHANGETHIS.html', 1500);
      }
    });
  </script>
</body>
</html>
